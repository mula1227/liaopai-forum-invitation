    "full": "冷辉，教授，主任医师，博士，博士后、博士生导师，博士后导师，国家青年岐黄学者，辽宁省名中医。辽宁省百千万人才工程项目“百”人层次，现任辽宁中医药大学附属医院耳鼻咽喉头颈外科主任、教研室主任。\n现任中华中医药学会耳鼻咽喉科分会副主任委员兼眩晕组组长；中国中西医结合耳鼻咽喉科分会常委兼眩晕医学专家委员会主任委员；中国研究型医院学会眩晕医学专业委员会副主任委员；世界中医药联合会耳鼻喉口腔专委会副会长。国际耳内科协会（IAPA）终身会员；CPAM耳内科学分会委员；辽宁省中西医结合学会耳鼻咽喉科专业委员会主任委员；辽宁省预防医学会耳鼻喉疾病防治委员会副主任委员；辽宁省生命科学协会耳鼻咽喉头颈外科专业委员会副主任委员；辽宁省中医药学会耳鼻咽喉科专业委员会主任委员；辽宁省医师协会耳鼻咽喉头颈外科专业委员会常委；沈阳市医学会及沈阳市医师协会耳鼻咽喉头颈外科专业委员会副主任委员。\n《中华耳科学》杂志通讯编委；《中国中西医结合耳鼻咽喉科杂志》编委；《辽宁医学杂志》编委；《转化医学杂志》审稿专家，国家统编教材《中医耳鼻咽喉科学》副主编；《中西医结合耳鼻咽喉科学》编委，主编出版专著多部，承担多项国家级及省市级课题，获得辽宁省自然科学学术成果一等奖，沈阳市自然科学学术成果一等奖；获得多项省市科技进步奖。",

    "full": "姓    名：刘峻\n主任医师，教授，中医学博士, 博士生导师。现任辽宁中医药大学附属医院脑病康复三科主任，王健全国名老中医药专家传承工作室负责人，第一批辽宁省优秀中医临床人才，辽宁彭氏眼针学术流派传承工作室主要传承人，沈阳市高级人才。兼任辽宁省养生康复学会脑病专委会主任委员，中华中医药学会中医康复技术传承创新平台常务委员，中国针灸学会针灸与民族疗法分会常务委员，中国针灸学会导引专业委员会常务委员，中国民族医药学会睡眠分会常务理事，辽宁省中医药学眩晕专委会副主任委员，辽宁省中西医结合学会神经内科专业委员会副主任委员，辽宁省养生康复学会眼针专委会副主任委员，辽宁省中医药学会脑病专业委员会常务委员，辽宁省中西医结合学会脑病康复专业委员常务委员，辽宁省养生康复学会常务理事，中华中医药学会脑病分会委员,中华中医药学会学术流派传承分会委员。\n近二十年来一直致力于针灸科的临床、科研和教学工作，不断探索中西医结合治疗神经系统疾病的有效途径，临证以突出中医特色为主，作为彭氏眼针流派主要传承人，精通眼针疗法等理论，擅长运用针灸尤其是火针配合中药治疗中风、眩晕、头痛、面瘫、失眠、郁证、痹症、痿证、癫痫、带状疱疹、耳鸣耳聋等疾病。在应用舌针、耳针、刃针、电针、梅花针、穴位注射、刺血疗法等治疗各种疑难病、罕见病方面有独到之处。 创立毫火针针刺夹脊穴的治疗方法，应用于中风后痉挛性瘫痪的康复治疗。\n先后参与《基于“观眼识证”的眼针疗法证、术、效关系及作用机制研究》国家重点基础研究发展计划（973计划）专项课题项目：眼针治疗腹泻型肠易激综合征临床研究。国家中医药管理局课题《辽宁彭氏眼针学术流派传承工作室建设项目》，国家中医药管理局行业专项课题《慢性疼痛中医止痛康复技术评价与推广研究：眼针•熥疗止痛技术治疗中风后肩手综合征（痰瘀阻络）临床试验研究》，国家自然科学基金课题《基于Keap1-Nrf2/ARE信号转导通路探讨眼针对脑缺血再灌注损伤保护机制》项目研究，辽宁省科技厅课题《项丛刺疗法治疗中风病吞咽障碍的疗效评价及关键技术研究》及《眼针疗法治疗慢性泄泻疗效评价与推广》，辽宁省教育厅课题《火针治疗脑卒中后肌张力增高的临床研究》和《眼针疗法对脑缺血再灌注模型大鼠cox-2表达影响及调控ERK1/2信号转导通路机》。主持辽宁省科技厅课题《基于KCC2-GABA信号通路探讨针刺夹脊穴抗卒中后痉挛效应的机制研究》，辽宁省教育厅课题《毫火针针刺夹脊穴治疗中风后痉挛性瘫痪临床研究》，《毫火针针刺夹脊穴调控细胞铁转运抑制铁死亡改善脑卒中后肢体痉挛的机制研究》。\n先后在国家级核心期刊杂志上发表论文30余篇，SCI3篇。专利2项，主编参编著作6部。",

    "full": "林星星\n医学博士，副教授，民盟盟员，硕士生导师，沈阳高层次人才领军人才（C类），辽宁中医药大学优秀教师。辽宁中医药大学针灸推拿学院经筋医学教研室主任，教学实训中心主任，针灸推拿学科秘书，针灸推拿学专业学位授权点秘书，辽宁中医药大学青创团队成员，王琦书院辽宁分院学员，辽宁省大学生中医药大健康产业创新创业大赛优秀指导教师，辽宁中医药大学创新创业导师。中国民间中医医药开发协会软组织诊疗专业委员会副秘书长，中国民间中医医药开发协会宣蛰人银质针疗法专业委员会副秘书长，中国针灸学会青年委员会第三届委员，辽宁省针灸学会脊柱侧弯康复专业委员会常务委员，中国针灸学会针灸整脊分会委员，辽宁中医药学会针刀专业委员会委员。哈工天愈机器人集团中医医学特聘专家。\n赴俄罗斯、新加坡等地交流指导，主要从事针灸、康复、推拿等医教研工作，研究方向为“基于经筋理论针灸镇痛的基础与临床研究”。目前主持辽宁省科技厅面上项目1项，辽宁省教育厅项目2项，横向课题2项。参与国家自然科学基金面上项目2项，科技部辽宁省中央引导地方科技发展专项1项，其余省市级课题10余项。主编著作1部，副主编著作1部，参编教材4部，发表SCI论文3篇，总影响因子15.6。核心论文15篇，实用新型专利3项，软件著作权2项。\n2019年中国康复研究中心北京博爱医院进修半年。主持辽宁省教育科学“十四五”规划2025年度立项一般课题1项，辽宁中医药大学校级教改课题2项，参与辽宁省研究生教育教学改革研究项目1项。《中医康复学》获批2022校级一流本科课程。获2022辽宁省教学成果一等奖（第3），2026辽宁省教学成果展示大赛特等奖（第2），2020年辽宁省首届普通高等学校大学生康复技能大赛优秀指导教师。2021华佗杯全国中医药院校针灸推拿临床技能大赛团体一等奖。2023第五届全国运动康复专业学生技能大赛优秀指导教师。2023第十四届全国中医药博士生论文大赛一等奖。2023辽宁中医药大学教育教学信息化大赛一等奖。第二十七届辽宁省教育教学信息化交流信息化教学课程案例三等奖。第二届全国说医解药科普大赛辽宁分赛区一等奖。第二十七届全国教师信息素养提升实践活动典型作品奖。辽宁中医药大学第五届教师教学创新大赛三等奖。作为指导教师获辽宁中医药大学大学生创新创业训练计划项目国家级立项1项。辽宁省大学生中医药大健康产业创新创业大赛优秀指导教师。\n掌握针灸、正骨、整脊、特种针、埋线、康复等技术，擅治疼痛类疾病：颈肩腰腿痛，膝骨性关节炎，头晕头痛，面瘫，中风后遗症，滑膜炎，腰椎间盘突出症，足跟痛，带状疱疹及后遗神经痛，痛风，脊柱及相关内脏疾病。",

</script><script>const $=s=>document.querySelector(s);

</script><script>// Original pentatonic plucked-string ambience, synthesized locally after a gesture.

 function createEngine(){
  context=new AudioEngine();master=context.createGain();master.gain.value=0;master.connect(context.destination);
  const soften=context.createBiquadFilter();soften.type='lowpass';soften.frequency.value=3400;soften.Q.value=.45;soften.connect(master);

 function stringBuffer(midi){
  if(buffers.has(midi))return buffers.get(midi);
  const sr=context.sampleRate,frequency=440*Math.pow(2,(midi-69)/12),period=Math.round(sr/frequency),length=Math.ceil(sr*4.2),buffer=context.createBuffer(1,length,sr),out=buffer.getChannelData(0),ring=new Float32Array(period);
  let seed=midi*1741+41;const random=()=>{seed=(seed*16807)%2147483647;return seed/1073741823.5-1;};let mean=0;
